[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "word-document-reading-claim-audit"
version = "0.1.0"
description = "Offline documentation claim auditor for Python projects"
requires-python = ">=3.9"
license = "MIT"
readme = "README.md"

[project.scripts]
word-document-reading-claim-audit = "word_document_reading_claim_audit.__main__:main"

[tool.setuptools.packages.find]
include = ["word_document_reading_claim_audit*", "tests"]
